services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: cyberpulse-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - " ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cyberpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: cyberpulse-postgres
    environment:
      POSTGRES_USER: cyberpulse
      POSTGRES_PASSWORD: cyberpulse_dev
      POSTGRES_DB: cyberpulse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberpulse -d cyberpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  elasticsearch_data:
  redis_data:
  postgres_data: